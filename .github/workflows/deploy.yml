name: CI / CD Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Continuous Integration (CI): Lint, Validate & Run Test Suite
  # =========================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fish_feed_shop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, zip, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy Environment & Generate App Key
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
          sed -i 's/# DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/# DB_PORT=3306/DB_PORT=3306/' .env
          sed -i 's/# DB_DATABASE=laravel/DB_DATABASE=fish_feed_shop/' .env
          sed -i 's/# DB_USERNAME=root/DB_USERNAME=root/' .env
          sed -i 's/# DB_PASSWORD=/DB_PASSWORD=/' .env
          php artisan key:generate

      - name: Migrate & Seed Database
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run Test Suite
        run: php artisan test

  # =========================================================================
  # 2. Continuous Deployment (CD): Deploy to cPanel via SSH
  # =========================================================================
  deploy:
    name: Deploy to cPanel Server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH Configuration
        id: check_ssh
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USERNAME }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::cPanel SSH Secrets (SSH_HOST, SSH_USERNAME, SSH_KEY) are not yet configured in GitHub Secrets. Tests passed! Add secrets to enable automatic server deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote SSH Commands
        if: steps.check_ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            # 1. Environment & PATH setup (including cPanel composer paths)
            export PATH="/opt/cpanel/composer/bin:/usr/local/bin:/usr/bin:$HOME/bin:$PATH"

            # 2. Locate project directory (from secret or intelligent auto-detection)
            TARGET_DIR="${{ secrets.SSH_PROJECT_PATH }}"

            if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
                echo "Using configured project directory: $TARGET_DIR"
            else
                for candidate in \
                    "$HOME/erp-and-pos" \
                    "$HOME/ERP-and-POS" \
                    "$HOME/erpandpos.thebrandoutletbd.com" \
                    "$HOME/public_html/erpandpos.thebrandoutletbd.com" \
                    "$HOME/public_html/erpandpos" \
                    "$HOME/public_html/erp" \
                    "$HOME/public_html"; do
                    if [ -d "$candidate" ] && ([ -f "$candidate/artisan" ] || [ -d "$candidate/.git" ]); then
                        TARGET_DIR="$candidate"
                        echo "Discovered project at: $TARGET_DIR"
                        break
                    fi
                done
            fi

            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
                FOUND=$(find "$HOME" -maxdepth 3 -name "artisan" -type f 2>/dev/null | head -n 1)
                if [ -n "$FOUND" ]; then
                    TARGET_DIR=$(dirname "$FOUND")
                    echo "Found artisan file at: $FOUND -> using $TARGET_DIR"
                fi
            fi

            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
                echo "::error::Could not find project directory on the server."
                echo "Existing directories in \$HOME:"
                ls -la "$HOME"
                exit 1
            fi

            cd "$TARGET_DIR"
            echo "Current working directory: $(pwd)"

            # 3. Detect or download Composer binary
            if command -v composer >/dev/null 2>&1; then
                COMPOSER_CMD="composer"
            elif [ -f "$HOME/composer.phar" ]; then
                COMPOSER_CMD="php $HOME/composer.phar"
            elif [ -f "$HOME/bin/composer" ]; then
                COMPOSER_CMD="$HOME/bin/composer"
            elif [ -f "composer.phar" ]; then
                COMPOSER_CMD="php composer.phar"
            else
                echo "Composer not found in PATH, downloading composer.phar..."
                php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                php composer-setup.php --quiet
                php -r "unlink('composer-setup.php');"
                COMPOSER_CMD="php composer.phar"
            fi
            echo "Using Composer command: $COMPOSER_CMD"

            # 4. Put application into quick maintenance mode if artisan is present
            if [ -f artisan ]; then
                php artisan down || true
            fi

            # 5. Pull latest code from GitHub main branch
            if [ -d .git ]; then
                git fetch origin main
                git reset --hard origin/main
            fi

            # 6. Ensure APP_KEY exists in .env
            if [ -f .env ]; then
                if ! grep -q "^APP_KEY=base64:" .env; then
                    echo "Generating missing APP_KEY in .env..."
                    php artisan key:generate --force
                fi
            elif [ -f .env.example ]; then
                echo ".env not found. Copying from .env.example and generating key..."
                cp .env.example .env
                php artisan key:generate --force
            fi

            # 7. Install production dependencies
            $COMPOSER_CMD install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 8. Run database migrations safely
            php artisan migrate --force

            # 9. Optimize and cache for high production performance
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:cache-components
            php artisan storage:link || true

            # 10. Bring application back online
            php artisan up
            echo "Deployment completed successfully!"
