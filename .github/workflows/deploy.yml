name: CI / CD Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Continuous Integration (CI): Lint, Validate & Run Test Suite
  # =========================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fish_feed_shop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, zip, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy Environment & Generate App Key
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
          sed -i 's/# DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/# DB_PORT=3306/DB_PORT=3306/' .env
          sed -i 's/# DB_DATABASE=laravel/DB_DATABASE=fish_feed_shop/' .env
          sed -i 's/# DB_USERNAME=root/DB_USERNAME=root/' .env
          sed -i 's/# DB_PASSWORD=/DB_PASSWORD=/' .env
          php artisan key:generate

      - name: Migrate & Seed Database
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run Test Suite
        run: php artisan test

  # =========================================================================
  # 2. Continuous Deployment (CD): Deploy to cPanel via SSH
  # =========================================================================
  deploy:
    name: Deploy to cPanel Server
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH Configuration
        id: check_ssh
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USERNAME }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::cPanel SSH Secrets (SSH_HOST, SSH_USERNAME, SSH_KEY) are not yet configured in GitHub Secrets. Tests passed! Add secrets to enable automatic server deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote SSH Commands
        if: steps.check_ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            export PATH="/opt/cpanel/composer/bin:/usr/local/bin:/usr/bin:$HOME/bin:$PATH"
            echo "Connected as user: $(whoami) at $(pwd)"
            TARGET_DIR="${{ secrets.SSH_PROJECT_PATH }}"
            if [ -z "$TARGET_DIR" ] && [ -d "$HOME/erpandpos.thebrandoutletbd.com" ]; then TARGET_DIR="$HOME/erpandpos.thebrandoutletbd.com"; fi
            if [ -z "$TARGET_DIR" ] && [ -d "$HOME/public_html/erpandpos.thebrandoutletbd.com" ]; then TARGET_DIR="$HOME/public_html/erpandpos.thebrandoutletbd.com"; fi
            if [ -z "$TARGET_DIR" ] && [ -d "$HOME/public_html/erpandpos" ]; then TARGET_DIR="$HOME/public_html/erpandpos"; fi
            if [ -z "$TARGET_DIR" ] && [ -d "$HOME/erp-and-pos" ]; then TARGET_DIR="$HOME/erp-and-pos"; fi
            if [ -z "$TARGET_DIR" ] && [ -d "$HOME/ERP-and-POS" ]; then TARGET_DIR="$HOME/ERP-and-POS"; fi
            if [ -z "$TARGET_DIR" ] && [ -f "$HOME/public_html/artisan" ]; then TARGET_DIR="$HOME/public_html"; fi
            if [ -z "$TARGET_DIR" ]; then TARGET_DIR=$(find "$HOME" -maxdepth 3 -name "artisan" -type f 2>/dev/null | head -n 1 | xargs -r dirname); fi
            echo "Target project directory: $TARGET_DIR"
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then echo "Could not find project directory. Set SSH_PROJECT_PATH secret."; ls -la "$HOME"; exit 1; fi
            cd "$TARGET_DIR"
            echo "Current directory: $(pwd)"
            COMPOSER_CMD="composer"
            if ! command -v composer >/dev/null 2>&1; then if [ -f "$HOME/composer.phar" ]; then COMPOSER_CMD="php $HOME/composer.phar"; elif [ -f "$HOME/bin/composer" ]; then COMPOSER_CMD="$HOME/bin/composer"; elif [ -f "composer.phar" ]; then COMPOSER_CMD="php composer.phar"; fi; fi
            echo "Using Composer command: $COMPOSER_CMD"
            php artisan down || true
            if [ -d .git ]; then git fetch origin main && git reset --hard origin/main; fi
            if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
            if ! grep -q "^APP_KEY=base64:" .env; then php artisan key:generate --force; fi
            $COMPOSER_CMD install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:cache-components
            php artisan storage:link || true
            php artisan up
            echo "Deployment successfully finished!"
