<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f766e" />
            <stop offset="50%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="pelletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f97316" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Rounded Background Squircle -->
    <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />

    <!-- Wave Accent Line -->
    <path d="M12 96 Q36 84 64 94 T116 90" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>

    <!-- Fish Body & Feed Pellets -->
    <g filter="url(#glow)">
        <!-- Main Fish Silhouette -->
        <path d="M28 64 C28 44 54 36 86 52 C98 57 106 50 110 46 C108 56 108 72 110 82 C106 78 98 71 86 76 C54 92 28 84 28 64 Z" fill="#ffffff" />
        
        <!-- Fish Dorsal Fin -->
        <path d="M60 40 C68 32 78 34 84 38 C76 43 70 46 64 50 Z" fill="#e0f2fe" opacity="0.95" />

        <!-- Fish Pectoral Fin -->
        <path d="M52 64 C58 64 64 70 66 76 C58 76 54 72 52 64 Z" fill="#ccfbf1" />

        <!-- Fish Eye -->
        <circle cx="42" cy="58" r="4.5" fill="#0f766e" />
        <circle cx="43.5" cy="56.5" r="1.5" fill="#ffffff" />

        <!-- Golden Feed Pellets -->
        <circle cx="18" cy="46" r="5" fill="url(#pelletGrad)" />
        <circle cx="14" cy="62" r="4" fill="url(#pelletGrad)" />
        <circle cx="20" cy="76" r="3.5" fill="url(#pelletGrad)" />
    </g>
</svg>
